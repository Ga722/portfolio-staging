# Instellingen voor het beheerscherm op /admin.
# Vul hieronder VUL-IN-… aan zoals in CMS-installatie.md beschreven staat.

backend:
  name: github
  repo: VUL-IN-GEBRUIKERSNAAM/VUL-IN-REPONAAM
  branch: main
  base_url: https://VUL-IN-WORKER-URL.workers.dev

# Waar geüploade beelden terechtkomen (map in de repo) en hoe de site ernaar verwijst.
media_folder: assets/werk
public_folder: assets/werk

# De hele portfolio staat in één bestand; het CMS bewerkt dat bestand.
collections:
  - name: portfolio
    label: Portfolio
    files:
      - name: projecten
        label: Projecten
        file: content/projects.json
        description: Alle projecten, gegroepeerd per categorie.
        fields:
          - name: categories
            label: Categorieën
            label_singular: categorie
            widget: list
            hint: De volgorde hier bepaalt de volgorde van de filterbalk en de projectlijst.

          - name: groups
            label: Categorieblokken
            label_singular: categorieblok
            widget: list
            summary: '{{fields.category}}'
            fields:
              - { name: category, label: Categorie, widget: string, hint: Moet exact overeenkomen met een naam uit de lijst Categorieën hierboven. }
              - name: items
                label: Projecten
                label_singular: project
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - { name: id, label: ID (in de URL), widget: string, pattern: ['^[a-z0-9-]+$', 'Alleen kleine letters, cijfers en koppeltekens.'] }
                  - { name: title, label: Titel, widget: string }
                  - { name: blurb, label: Korte regel in de lijst, widget: string, required: false }
                  - { name: description, label: Inleiding op de projectpagina, widget: text, required: false }
                  - { name: client, label: Klant, widget: string, required: false }
                  - { name: role, label: Rol, widget: string, required: false }
                  - { name: year, label: Jaar, widget: string, required: false }
                  - { name: highlight, label: Uitgelicht (1–5, 0 = niet), widget: number, default: 0, value_type: int, min: 0, max: 5 }
                  - { name: image, label: Hoofdbeeld, widget: image, required: false }
                  - { name: ratio, label: Verhouding hoofdbeeld, widget: string, required: false, hint: 'Breedte / hoogte van je bestand, bv. 1912 / 916.' }
                  - { name: fit, label: Beeld volledig tonen op wit, widget: select, required: false, options: ['', contain], hint: 'Kies contain voor schermafbeeldingen; leeg = vullend.' }
                  - { name: heroRatio, label: Aparte verhouding hoofdbeeld, widget: string, required: false }
                  - { name: heroFit, label: Aparte fit hoofdbeeld, widget: string, required: false }
                  - { name: embed, label: Video- of flipbook-embed (URL), widget: string, required: false, hint: 'YouTube: https://www.youtube.com/embed/CODE' }
                  - { name: embedTitle, label: Kop boven de embed, widget: string, required: false }
                  - { name: link, label: Externe link, widget: string, required: false }
                  - { name: linkLabel, label: Tekst op de linkknop, widget: string, required: false, hint: 'Leeg = "Bekijk online".' }
                  - { name: video, label: Videolink, widget: string, required: false }
                  - { name: processTitle, label: Kop boven de procesblokken, widget: string, required: false, default: Het proces }
                  - name: process
                    label: Procesblokken
                    label_singular: blok
                    widget: list
                    required: false
                    summary: '{{fields.title}}'
                    fields:
                      - { name: title, label: Kop, widget: string }
                      - { name: blurb, label: Tekst, widget: text }
                      - { name: tall, label: Hoge capture (schuifkader), widget: boolean, required: false, default: false }
                      - name: images
                        label: Beelden
                        label_singular: beeld
                        widget: list
                        required: false
                        fields:
                          - { name: src, label: Beeld, widget: image }
                          - { name: ratio, label: Verhouding, widget: string, required: false }
                          - { name: caption, label: Onderschrift, widget: string, required: false }
                  - name: gallery
                    label: Extra beelden onderaan
                    label_singular: beeld
                    widget: list
                    required: false
                    fields:
                      - { name: src, label: Beeld, widget: image }
                      - { name: ratio, label: Verhouding, widget: string, required: false }
                      - { name: caption, label: Onderschrift, widget: string, required: false }
                  - name: files
                    label: Downloads
                    label_singular: bestand
                    widget: list
                    required: false
                    fields:
                      - { name: label, label: Naam, widget: string }
                      - { name: src, label: Bestand, widget: file }
